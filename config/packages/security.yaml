security:
    enable_authenticator_manager: true

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        chain_provider:
            chain:
                providers: [in_memory, app_user_provider, uid_user_provider]
        in_memory:
            memory:
                users:
                    __NO_USER__:
                        password: ~
                        roles: ROLE_ANON
        uid_user_provider:
            id: uid_user_provider
        app_user_provider:
            entity:
                class: App\Entity\Account
                property: uid

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt|error)|css|images|js)/
            security: false

        cas:
            pattern: ^/cas/
            provider: chain_provider
            security: true
            custom_authenticators:
                - cas.security.authentication.authenticator
            logout:
                path: /logout
            access_denied_handler: App\EventListener\AccessDeniedListener

        casc:
            pattern: ^/casc/
            provider: chain_provider
            security: true
            custom_authenticators:
                - casc.security.authentication.authenticator
            logout:
                path: /logout2
            access_denied_handler: App\EventListener\AccessDeniedListener

        orcid:
            pattern: ^/connect/orcid
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\OrcidAuthenticator
            access_denied_handler: App\EventListener\AccessDeniedListener

        main:
            pattern: ^/
            security: true
            lazy: true
            provider: chain_provider
            access_denied_handler: App\EventListener\AccessDeniedListener
            custom_authenticators:
                - App\Security\ChainedAuthenticator         
            logout:
                path: /logout   

    access_control:
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_MODERATOR }  

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

